services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    container_name: lumina-api

    restart: unless-stopped

    ports:
      - "${PORT}:${PORT}"

    env_file:
      - .env

    environment:
      # Dentro de la red de Compose el host es el nombre del servicio (redis)
      # y el puerto es el INTERNO (6379), no el publicado en el host (6390).
      # Esto sobreescribe el REDIS_URL del .env, que sirve para correr fuera de Docker.
      REDIS_URL: redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

    networks:
      - app-network


  redis:
    image: redis:7-alpine

    container_name: lumina-redis

    restart: unless-stopped

    ports:
      - "6390:6379"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-network


volumes:
  redis-data:


networks:
  app-network:
    driver: bridge